<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Club</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <h1>Add Club</h1>
    <form id="addClubForm">
      <label for="area">Area:</label>
      <input type="text" id="area" name="area" required /><br /><br />

      <label for="club_name">Club Name:</label>
      <input type="text" id="club_name" name="club_name" required /><br /><br />

      <label for="instagram">Instagram:</label>
      <input type="text" id="instagram" name="instagram" required /><br /><br />

      <label for="image_logo">Image Logo:</label>
      <input
        type="text"
        id="image_logo"
        name="image_logo"
        required
      /><br /><br />

      <label for="joinable">Joinable:</label>
      <input type="text" id="joinable" name="joinable" required /><br /><br />

      <label for="members">Members:</label>
      <input type="number" id="members" name="members" required /><br /><br />

      <label for="image_club">Image Club:</label>
      <input
        type="text"
        id="image_club"
        name="image_club"
        required
      /><br /><br />

      <button type="submit">Add Club</button>
    </form>

    <script>
      const form = document.getElementById('addClubForm');

      form.addEventListener('submit', async (event) => {
        event.preventDefault(); // 기본 폼 제출 동작 방지

        // 폼 데이터 가져오기
        const data = {
          area: document.getElementById('area').value,
          club_name: document.getElementById('club_name').value,
          instagram: document.getElementById('instagram').value,
          image_logo: document.getElementById('image_logo').value,
          joinable: document.getElementById('joinable').value,
          members: parseInt(document.getElementById('members').value, 10),
          image_club: document.getElementById('image_club').value,
        };

        try {
          // Axios를 사용하여 POST 요청 전송
          const response = await axios.post(
            'http://http://112.152.14.116:1116/add-club',
            data
          );
          alert('Club added successfully!');
          console.log(response.data);
        } catch (error) {
          alert('An error occurred while adding the club.');
          console.error(error);
        }
      });
    </script>
  </body>
</html>
